<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acervo — 003</title>
  <meta name="description" content="Publicação de Evan sobre identidade e expressão de gênero, em tom afirmativo e bem-humorado." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Acervo — 003" />
  <meta property="og:description" content="Publicação de Evan sobre identidade e expressão de gênero, em tom afirmativo e bem-humorado." />
  <meta property="og:image" content="../assets/social_03.png" />
  <script>
    (() => {
      const saved = localStorage.getItem('acervo-theme');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light');
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4ef;
      --text: #151515;
      --muted: rgba(21,21,21,.62);
      --line: rgba(21,21,21,.12);
      --chip-bg: rgba(21,21,21,.05);
      --chip-border: rgba(21,21,21,.16);
      --panel-bg: rgba(245,244,239,.97);
      --image-bg: #eceae3;
      --toast-bg: rgba(21,21,21,.92);
      --toast-text: #fff;
    }

    :root[data-theme="dark"] {
      --bg: #0f0f0d;
      --text: #fff;
      --muted: rgba(255,255,255,.6);
      --line: rgba(255,255,255,.1);
      --chip-bg: rgba(255,255,255,.08);
      --chip-border: rgba(255,255,255,.2);
      --panel-bg: rgba(18,18,16,.96);
      --image-bg: #121210;
      --toast-bg: rgba(235,235,230,.92);
      --toast-text: #111;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .viewer {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      min-height: 100vh;
    }

    .nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 18px;
      z-index: 10;
      background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 82%, transparent) 0%, transparent 100%);
    }

    .brand {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip {
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid var(--chip-border);
      background: var(--chip-bg);
      color: var(--text);
      font: inherit;
      font-size: 0.84rem;
      text-decoration: none;
      cursor: pointer;
    }

    .chip:hover { filter: brightness(1.08); }

    .image-area {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 74px 20px 0;
      background: var(--image-bg);
    }

    .image-area img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .info {
      padding: 14px 22px 22px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .info-num {
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--muted);
      white-space: nowrap;
    }

    .info-desc {
      flex: 1;
      font-size: 0.93rem;
      line-height: 1.55;
      color: var(--muted);
      min-width: min(100%, 320px);
    }

    .info-autor {
      font-size: 0.88rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .mini-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid var(--chip-border);
      background: transparent;
      color: var(--muted);
      font: 700 0.75rem/1 Inter, sans-serif;
      cursor: pointer;
      flex-shrink: 0;
    }

    .mini-btn:hover,
    .mini-btn[aria-expanded="true"] {
      color: var(--text);
      background: var(--chip-bg);
    }

    .panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel-bg);
      border-top: 1px solid var(--line);
      padding: 22px 26px 28px;
      z-index: 30;
      transform: translateY(100%);
      transition: transform .25s cubic-bezier(.4,0,.2,1);
    }

    .panel.open { transform: translateY(0); }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-label {
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
    }

    .close:hover { color: var(--text); }

    .panel-text {
      font-size: 1rem;
      line-height: 1.65;
      color: var(--muted);
      max-width: 84ch;
    }

    .panel-text p + p { margin-top: .55em; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(14px);
      background: var(--toast-bg);
      color: var(--toast-text);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="viewer">
    <nav class="nav">
      <a class="brand" href="../">acervo.digital</a>
      <div class="nav-actions">
        <button class="chip" id="themeToggle" type="button">tema</button>
        <a class="chip" href="../2/">Anterior</a>
        <a class="chip" href="../1/">Próximo</a>
        <a class="chip" href="../">Galeria</a>
        <a class="chip" href="../assets/publicacao_03.png" download>Baixar</a>
        <button class="chip" id="shareBtn" type="button">Compartilhar</button>
      </div>
    </nav>

    <div class="image-area">
      <img src="../assets/publicacao_03.png" alt="Captura de tela de uma publicação de Evan, perfil @Scharnovski_, no Twitter. Na postagem, o autor escreve uma frase sobre gays afeminadas, associando isso à ideia de também serem &quot;um pouco mulher&quot;, e encerra com uma congratulação em tom afirmativo. Na parte inferior aparecem o horário, a data, o cliente &quot;Twitter Web App&quot;, além da contagem de comentários e curtidas. A interface também mostra a mensagem de que o tweet foi excluído." />
    </div>

    <div class="info">
      <span class="info-num">003</span>
      <p class="info-desc">Publicação de Evan sobre identidade e expressão de gênero, em tom afirmativo e bem-humorado.</p>
      <span class="info-autor">@Scharnovski_</span>
      <button class="mini-btn" id="txtBtn" type="button" aria-expanded="false" aria-controls="txtPanel" title="Ver transcrição">Txt</button>
      <button class="mini-btn" id="altBtn" type="button" aria-expanded="false" aria-controls="altPanel" title="Ver descrição da imagem">Alt</button>
    </div>
  </div>

  <div class="panel" id="altPanel" role="dialog" aria-label="Descrição da imagem" aria-modal="false">
    <div class="panel-header">
      <span class="panel-label">Descrição da imagem</span>
      <button class="close" id="altClose" type="button" aria-label="Fechar">&#x2715;</button>
    </div>
    <p class="panel-text" id="altText"></p>
  </div>

  <div class="panel" id="txtPanel" role="dialog" aria-label="Transcrição" aria-modal="false">
    <div class="panel-header">
      <span class="panel-label">Transcrição</span>
      <button class="close" id="txtClose" type="button" aria-label="Fechar">&#x2715;</button>
    </div>
    <div class="panel-text">
      <p>Nós, as gays afeminadas, também somos um pouco mulher. Parabéns pra nós!</p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const NAV = { prev: '../2/', next: '../1/' };

    const themeToggle = document.getElementById('themeToggle');
    const shareBtn = document.getElementById('shareBtn');
    const toast = document.getElementById('toast');
    const img = document.querySelector('.image-area img');
    const altText = document.getElementById('altText');

    const altBtn = document.getElementById('altBtn');
    const altPanel = document.getElementById('altPanel');
    const altClose = document.getElementById('altClose');

    const txtBtn = document.getElementById('txtBtn');
    const txtPanel = document.getElementById('txtPanel');
    const txtClose = document.getElementById('txtClose');

    let timer;

    altText.textContent = img.getAttribute('alt');

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('acervo-theme', theme);
      themeToggle.textContent = theme === 'dark' ? 'tema: escuro' : 'tema: claro';
    }

    function showToast(message) {
      toast.textContent = message;
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
      clearTimeout(timer);
      timer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(14px)';
      }, 2200);
    }

    function togglePanel(panel, button, open) {
      panel.classList.toggle('open', open);
      button.setAttribute('aria-expanded', String(open));
    }

    function closeAllPanels() {
      togglePanel(altPanel, altBtn, false);
      togglePanel(txtPanel, txtBtn, false);
    }

    themeToggle.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    });

    altBtn.addEventListener('click', () => {
      const open = !altPanel.classList.contains('open');
      togglePanel(altPanel, altBtn, open);
      if (open) togglePanel(txtPanel, txtBtn, false);
    });

    txtBtn.addEventListener('click', () => {
      const open = !txtPanel.classList.contains('open');
      togglePanel(txtPanel, txtBtn, open);
      if (open) togglePanel(altPanel, altBtn, false);
    });

    altClose.addEventListener('click', closeAllPanels);
    txtClose.addEventListener('click', closeAllPanels);

    altPanel.addEventListener('click', (e) => { if (e.target === altPanel) closeAllPanels(); });
    txtPanel.addEventListener('click', (e) => { if (e.target === txtPanel) closeAllPanels(); });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAllPanels();
      if (e.key === 'ArrowLeft') window.location.href = NAV.prev;
      if (e.key === 'ArrowRight') window.location.href = NAV.next;
    });

    shareBtn.addEventListener('click', async () => {
      const url = window.location.href;
      const data = { title: 'Acervo — 003 · Evan', text: 'Publicação de Evan sobre identidade e expressão de gênero, em tom afirmativo e bem-humorado.', url };
      if (navigator.share) {
        try { await navigator.share(data); return; } catch (e) { if (e.name === 'AbortError') return; }
      }

      try {
        await navigator.clipboard.writeText(url);
        showToast('Link copiado');
      } catch {
        const input = Object.assign(document.createElement('input'), { value: url });
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        input.remove();
        showToast('Link copiado');
      }
    });

    applyTheme(document.documentElement.dataset.theme || 'dark');
  </script>
</body>
</html>
