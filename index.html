<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acervo</title>
  <meta name="description" content="Acervo.digital — galeria de publicações digitais preservadas." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Acervo" />
  <meta property="og:description" content="Galeria de publicações digitais preservadas." />
  <meta property="og:image" content="assets/publicacao_01.png" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #0f0f0d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    .header {
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .brand {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
      text-decoration: none;
    }

    .brand-domain {
      font-weight: 400;
      color: rgba(255,255,255,.4);
      margin-left: 5px;
    }

    .count {
      font-size: 0.85rem;
      color: rgba(255,255,255,.28);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1px;
      background: rgba(255,255,255,.07);
    }

    .item {
      background: #0f0f0d;
      text-decoration: none;
      color: inherit;
      display: block;
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 5;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }

    .item:hover img { transform: scale(1.03); }

    .item-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 48px 20px 20px;
      background: linear-gradient(to top, rgba(0,0,0,.78) 0%, transparent 100%);
    }

    .item-num {
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: .12em;
      color: rgba(255,255,255,.38);
      margin-bottom: 5px;
    }

    .item-desc {
      font-size: 0.93rem;
      line-height: 1.45;
      color: rgba(255,255,255,.88);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-autor {
      margin-top: 7px;
      font-size: 0.83rem;
      color: rgba(255,255,255,.38);
    }

    .footer {
      padding: 20px 28px;
      color: rgba(255,255,255,.18);
      font-size: 0.82rem;
      border-top: 1px solid rgba(255,255,255,.07);
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="/">acervo.digital</a>
    <span class="count">2 publicações</span>
  </header>

  <main class="gallery">
    <a class="item" href="publicacao_01.html">
      <img src="assets/publicacao_01.png" alt="Publicação 001" />
      <div class="item-info">
        <div class="item-num">001</div>
        <p class="item-desc">Descrição da publicação 001. Obra preservada com valor documental.</p>
        <div class="item-autor">@autor1</div>
      </div>
    </a>

    <a class="item" href="publicacao_02.html">
      <img src="assets/publicacao_02.png" alt="Publicação 002" />
      <div class="item-info">
        <div class="item-num">002</div>
        <p class="item-desc">Descrição da publicação 002. Obra preservada com valor documental.</p>
        <div class="item-autor">@autor2</div>
      </div>
    </a>
  </main>

  <footer class="footer">POC estática · GitHub Pages</footer>
</body>
</html>
